name: Build postmarketOS Rootfs (aarch64)

on:
  workflow_dispatch:
    inputs:
      ui_interface:
        description: 'Pilih User Interface (UI)'
        required: true
        default: 'phosh'
        type: choice
        options:
          - phosh
          - xfce4
          - plasma-mobile
          - console

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pmbootstrap & Dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3-setuptools git procps sudo coreutils zip

          # Install pmbootstrap langsung dari repo Git resmi (Fix error PyPI yanked)
          # NOTE: postmarketOS sudah rename default branch pmbootstrap dari "master" -> "main"
          # (lihat: https://postmarketos.org/edge/2026/03/15/pmaports-default-branch-changed/)
          # Tidak pakai suffix branch sama sekali supaya otomatis ikut default branch repo,
          # jadi tidak gampang rusak lagi kalau nama default branch berubah lagi nanti.
          pip3 install --user "git+https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git"

          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Environment & Kernel File
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pmbootstrap --version

          if [ ! -f "${GITHUB_WORKSPACE}/boot.img-kernel" ]; then
            echo "Error: File boot.img-kernel tidak ditemukan di root repository!"
            exit 1
          fi
          echo "boot.img-kernel ditemukan di root repository."

      - name: Prepare Local pmaports + Custom Device Package
        run: |
          set -e
          WORK=/tmp/pmbootstrap
          APORTS=$WORK/cache_git/pmaports
          DEVICE_DIR=$APORTS/device/testing/device-samsung-a022f
          KDIR=$APORTS/device/testing/linux-samsung-a022f

          mkdir -p "$WORK"

          # samsung-a022f BELUM ada di pmaports resmi, jadi kita clone pmaports
          # dulu secara manual, lalu suntikkan device package kita SENDIRI
          # sebelum "pmbootstrap init" dijalankan. Dengan begitu pmbootstrap
          # akan menganggap device ini sudah "ada" (bukan porting baru), dan
          # wizard init jadi bisa dijawab otomatis (jumlah pertanyaan pasti/pendek).
          # NOTE: pmaports default branch juga sudah di-rename master -> main
          # (bareng dengan pmbootstrap, lihat catatan di step sebelumnya).
          git clone --depth 1 --branch main \
            https://gitlab.postmarketos.org/postmarketOS/pmaports.git "$APORTS"

          # --- Device package (deviceinfo + APKBUILD referensi ke paket kernel) ---
          # NOTE: heredoc di-pipe ke `sed` untuk membuang indentasi YAML,
          # supaya isi file deviceinfo/APKBUILD rapi mulai dari kolom 0.
          mkdir -p "$DEVICE_DIR"
          sed 's/^[[:space:]]*//' > "$DEVICE_DIR/deviceinfo" <<'EOF'
          # TODO: nilai-nilai ini ASUMSI berbasis chipset MediaTek MT6765 &
          # metode flash Samsung (Odin/Download Mode -> Heimdall). WAJIB
          # dicek ulang (terutama nama partisi BOOT/SYSTEM) sebelum flash
          # ke unit fisik.
          deviceinfo_format_version="2"
          deviceinfo_name="Samsung Galaxy A02"
          deviceinfo_manufacturer="Samsung"
          deviceinfo_codename="samsung-a022f"
          deviceinfo_year="2021"
          deviceinfo_chassis="handset"
          deviceinfo_arch="aarch64"
          deviceinfo_kernel_cmdline=""
          deviceinfo_generate_bootimg="true"
          deviceinfo_flash_offset_base="0x00000000"
          deviceinfo_flash_pagesize="2048"
          deviceinfo_bootimg_qcdt="false"
          deviceinfo_bootimg_mtk_mkimage="true"
          # Samsung pakai Odin/Download Mode -> di postmarketOS ini dihandle
          # lewat protokol Heimdall (reverse-engineered dari Odin), bukan
          # fastboot standar. "heimdall-bootimg" dipakai karena kita generate
          # boot.img (deviceinfo_generate_bootimg=true di atas); kalau device
          # kamu ternyata butuh flash kernel+initramfs terpisah (tanpa boot.img
          # standar), gantinya "heimdall-isorec".
          deviceinfo_flash_method="heimdall-bootimg"
          # TODO: konfirmasi nama partisi asli via `heimdall print-pit` di HP kamu.
          # BOOT/SYSTEM ini nama umum di banyak device Samsung, tapi bisa beda.
          deviceinfo_flash_heimdall_partition_kernel="BOOT"
          deviceinfo_flash_heimdall_partition_system="SYSTEM"
          EOF

          sed 's/^[[:space:]]*//' > "$DEVICE_DIR/APKBUILD" <<'EOF'
          pkgname="device-samsung-a022f"
          pkgver=1
          pkgrel=0
          pkgdesc="Samsung Galaxy A02 (SM-A022F)"
          arch="aarch64"
          url="https://postmarketos.org"
          license="MIT"
          depends="linux-samsung-a022f mkbootimg mesa-dri-swrast"
          makedepends="devicepkg-dev"
          subpackages="$pkgname-nonfree-firmware:nonfree_firmware"
          source="deviceinfo"
          options="!check !archcheck"

          build() { devicepkg_build $pkgname $_carch; }
          package() { devicepkg_package $pkgname $_carch; }
          nonfree_firmware() { devicepkg_subpkg_nonfree_firmware "$pkgname"; }

          sha512sums="SKIP"
          EOF

          # --- Kernel package: bungkus boot.img-kernel yang sudah jadi, tanpa compile ---
          mkdir -p "$KDIR"
          cp "${GITHUB_WORKSPACE}/boot.img-kernel" "$KDIR/boot.img-kernel"
          sed 's/^[[:space:]]*//' > "$KDIR/APKBUILD" <<'EOF'
          pkgname="linux-samsung-a022f"
          pkgver=1
          pkgrel=0
          pkgdesc="Samsung Galaxy A02 (SM-A022F) downstream kernel (prebuilt binary)"
          arch="aarch64"
          _flavor="samsung-a022f"
          url="https://postmarketos.org"
          license="GPL-2.0-only"
          options="!strip !check !tracedeps pmb:cross-native"
          subpackages="$pkgname-dev"
          source="boot.img-kernel"

          build() { :; }
          package() {
            install -D "$srcdir"/boot.img-kernel "$pkgdir"/boot/vmlinuz-$_flavor
            mkdir -p "$pkgdir"/usr/share/kernel/$_flavor
            echo "$pkgver-postmarketOS" > "$pkgdir"/usr/share/kernel/$_flavor/kernel.release
          }

          sha512sums="SKIP"
          EOF

          echo "Device package samsung-a022f (deviceinfo + APKBUILD + kernel) berhasil disiapkan di pmaports lokal."

      - name: Configure pmbootstrap Project
        run: |
          sudo apt install -y expect
          export PATH="$HOME/.local/bin:$PATH"
          export WORK=/tmp/pmbootstrap
          export APORTS=$WORK/cache_git/pmaports
          export UI="${{ github.event.inputs.ui_interface }}"
          export HOSTNAME_VAL="pmos-a022f"

          # pmbootstrap 3.x: "init" murni wizard interaktif, dan ternyata jumlah/urutan
          # prompt-nya TIDAK sesederhana dugaan awal (ada prompt "pmaports path" terpisah,
          # ada prompt "Install systemd?", jumlah prompt "Provider" bisa 0/lebih, dst).
          # Jawab positional (printf) jadi rapuh karena satu prompt tak terduga bikin semua
          # jawaban geser. Solusinya pakai `expect`: cocokkan berdasarkan TEKS pertanyaan,
          # bukan urutan, jadi tahan terhadap prompt tambahan/hilang.
          sed 's/^[[:space:]]*//' > /tmp/pmb_init.exp <<'EOF'
          #!/usr/bin/expect -f
          set timeout 300
          spawn pmbootstrap -p $env(APORTS) init
          expect {
            -re {Work path.*:\s*$} { send "$env(WORK)\r"; exp_continue }
            -re {pmaports path.*:\s*$} { send "\r"; exp_continue }
            -re {Channel \[.*\]:\s*$} { send "edge\r"; exp_continue }
            -re {Vendor \[.*\]:\s*$} { send "samsung\r"; exp_continue }
            -re {Device codename.*:\s*$} { send "a022f\r"; exp_continue }
            -re {create a new device port.*\(y/n\).*:\s*$} { send "n\r"; exp_continue }
            -re {Username \[.*\]:\s*$} { send "user\r"; exp_continue }
            -re {Provider \[.*\]:\s*$} { send "\r"; exp_continue }
            -re {User interface \[.*\]:\s*$} { send "$env(UI)\r"; exp_continue }
            -re {Install systemd.*:\s*$} { send "\r"; exp_continue }
            -re {Extra packages \[.*\]:\s*$} { send "\r"; exp_continue }
            -re {Locale \[.*\]:\s*$} { send "\r"; exp_continue }
            -re {hostname.*\[.*\]:\s*$} { send "$env(HOSTNAME_VAL)\r"; exp_continue }
            -re {copy these public keys.*\(y/n\).*:\s*$} { send "n\r"; exp_continue }
            -re {Build outdated packages.*\(y/n\).*:\s*$} { send "n\r"; exp_continue }
            -re {Zap existing chroots.*\(y/n\).*:\s*$} { send "n\r"; exp_continue }
            eof
          }
          catch wait result
          exit [lindex $result 3]
          EOF

          chmod +x /tmp/pmb_init.exp
          /tmp/pmb_init.exp

          # Jaga-jaga: pastikan value kritis benar walau ada pergeseran prompt yang tak terduga
          pmbootstrap status --details || true
          pmbootstrap config device samsung-a022f
          pmbootstrap config ui "$UI"
          pmbootstrap config hostname "$HOSTNAME_VAL"
          pmbootstrap config user user
          pmbootstrap status --details

      - name: Build Rootfs & Boot Image
        run: |
          export PATH="$HOME/.local/bin:$PATH"

          # Build rootfs dan image sistem (password user default: 1234)
          pmbootstrap install --password 1234 --cipher aes-xts-plain64

          # Export hasil build ke folder sementara
          pmbootstrap export /tmp/postmarketOS-export

      - name: Compress System Images
        id: compress
        run: |
          cd /tmp/postmarketOS-export

          DATE_STR=$(TZ=Asia/Jakarta date +%Y%m%d-%H%M)
          echo "date=$DATE_STR" >> $GITHUB_OUTPUT

          # Buat archive zip agar hemat ukuran upload/download
          zip -r9 ${{ github.workspace }}/pmOS-Samsung-A022F-rootfs-${DATE_STR}.zip ./*

      - name: Upload Release Artifact
        uses: ncipollo/release-action@v1.12.0
        with:
          artifacts: "${{ github.workspace }}/*.zip"
          name: "pmOS Rootfs Image SM-A022F (${{ github.event.inputs.ui_interface }}) - ${{ steps.compress.outputs.date }}"
          draft: false
          prerelease: false
          tag: "pmos-rootfs-${{ steps.compress.outputs.date }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## postmarketOS System Image (Rootfs) Build
            - **Target Device**: Samsung Galaxy A02 (SM-A022F)
            - **Architecture**: `aarch64`
            - **UI Selected**: `${{ github.event.inputs.ui_interface }}`
            - **Default User Password**: `1234`

            ### Isi File Zip:
            - `samsung-a022f.img` (Rootfs / System Partition)
            - `boot.img` (Kernel + pmOS Initramfs)

      - name: Completion Info
        run: |
          echo "Build Rootfs Selesai!"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/pmos-rootfs-${{ steps.compress.outputs.date }}"
